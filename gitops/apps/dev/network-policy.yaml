apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policy-dev
  namespace: argocd
spec:
  project: moment-dev
  source:
    repoURL: https://github.com/Team-msp-architect-2026/msp-team04-infra
    targetRevision: develop
    path: gitops/charts/network-policy
    helm:
      valueFiles:
        - ../../values/dev/network-policy-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: moment-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=false

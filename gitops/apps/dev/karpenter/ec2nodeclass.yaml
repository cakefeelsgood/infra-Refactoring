# AL2023 + encrypted gp3, as in the karpenter-spot-lab experiment.
# Subnets: only the /20 Karpenter node subnets carry karpenter.sh/discovery (terraform modules/dev-vpc).
# Security group: the EKS cluster primary SG, tagged by terraform/modules/karpenter.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: moment-dev-karpenter-node-role
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: moment-dev-eks-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: moment-dev-eks-cluster
  tags:
    Project: moment
    Environment: dev
    Owner: team04
    ManagedBy: karpenter
  # maxPods 40 requires VPC CNI Prefix Delegation (vpc-cni configuration_values in
  # terraform/environments/<env>/main.tf). Change both together; checked by
  # scripts/validation/check-pd-maxpods.sh.
  kubelet:
    maxPods: 40
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

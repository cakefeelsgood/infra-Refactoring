# kube-prometheus-stack values for prod environment
# Prod EKS 비활성 또는 short-lived demo 정책이면 runtime sync는 별도 승인 후 진행
# M4 scope: Metrics + Dashboard + Health + Alert 중심
# Loki / Promtail 중앙 로그 수집은 M4 범위 외

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

  # Application metrics scrape targets managed by kube-prometheus-stack.
  # Backend and AI metrics endpoints are implemented in application code.
  # Batch Worker is intentionally excluded because it has no HTTP metrics endpoint.
  additionalServiceMonitors:
    - name: moment-backend-api-prod
      additionalLabels:
        app.kubernetes.io/name: backend-api
        app.kubernetes.io/part-of: moment
        environment: prod
      selector:
        matchLabels:
          app.kubernetes.io/name: backend-api
          app.kubernetes.io/instance: backend-api-prod
      namespaceSelector:
        matchNames:
          - moment-prod
      endpoints:
        - port: http
          path: /actuator/prometheus
          interval: 30s
          scrapeTimeout: 10s
          scheme: http

    - name: moment-ai-service-prod
      additionalLabels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/part-of: moment
        environment: prod
      selector:
        matchLabels:
          app.kubernetes.io/name: ai-service
          app.kubernetes.io/instance: ai-service-prod
      namespaceSelector:
        matchNames:
          - moment-prod
      endpoints:
        - port: http
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s
          scheme: http

grafana:
  enabled: true
  persistence:
    enabled: true
    storageClassName: gp2
    size: 10Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
      provider:
        allowUiUpdates: false

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfigMatcherStrategy:
      type: None
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# kube-prometheus-stack chart에는 포함되지 않는 별도 로그 수집 도구를 명시적으로 비활성화한다.
loki:
  enabled: false

promtail:
  enabled: false


# EKS managed control plane components are not scraped through kube-system Services.
# Keep monitoring AppProject scoped to the monitoring namespace and avoid kube-system Service creation.
kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

kubeProxy:
  enabled: false

coreDns:
  enabled: false

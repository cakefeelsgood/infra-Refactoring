namespace: moment-prod

replicaCount: 2

image:
  repository: 611058323802.dkr.ecr.ap-northeast-3.amazonaws.com/moment-prod-backend-api
  tag: "prod-c6536a4"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: moment-prod-backend-api-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::611058323802:role/moment-prod-backend-irsa-role"

config:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_BATCH_JOB_ENABLED: "false"
  AWS_REGION: ap-northeast-3
  ENVIRONMENT: prod
  DB_HOST: moment-prod-postgres.c3qggqseuzcb.ap-northeast-3.rds.amazonaws.com
  DB_PORT: "5432"
  DB_NAME: moment
  DB_URL: "jdbc:postgresql://moment-prod-postgres.c3qggqseuzcb.ap-northeast-3.rds.amazonaws.com:5432/moment"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://moment-prod-postgres.c3qggqseuzcb.ap-northeast-3.rds.amazonaws.com:5432/moment"
  SPRING_FLYWAY_URL: "jdbc:postgresql://moment-prod-postgres.c3qggqseuzcb.ap-northeast-3.rds.amazonaws.com:5432/moment"
  REDIS_HOST: moment-prod-redis.o0zxzf.ng.0001.apn3.cache.amazonaws.com
  REDIS_PORT: "6379"
  OPENSEARCH_PORT: "443"
  OPENSEARCH_SCHEME: https
  OPENSEARCH_HOST: vpc-moment-prod-opensearch-2trht5bolkacngjunc6lsbibuq.ap-northeast-3.es.amazonaws.com
  PROFILE_IMAGE_BUCKET_NAME: moment-prod-profile-image-611058323802-ap-northeast-3
  PROFILE_IMAGE_PUBLIC_URL_BASE: https://moment-prod-profile-image-611058323802-ap-northeast-3.s3.ap-northeast-3.amazonaws.com
  PROFILE_IMAGE_PRESIGNED_URL_EXPIRATION_SECONDS: "600"
  PROFILE_IMAGE_MAX_FILE_SIZE_BYTES: "5242880"
  PROFILE_IMAGE_KEY_PREFIX: uploads/profile
  SQS_QUEUE_NAME: moment-prod-public-data-queue
  SQS_QUEUE_URL: https://sqs.ap-northeast-3.amazonaws.com/611058323802/moment-prod-public-data-queue
  AI_SERVICE_BASE_URL: "http://ai-service:8000"
  NOTIFICATION_SNS_ENABLED: "false"
  NOTIFICATION_SNS_TOPIC_ARN: ""

secretRefs:
  - envName: DB_USERNAME
    secretName: moment-prod-backend-api-secret
    secretKey: db-username
  - envName: DB_PASSWORD
    secretName: moment-prod-backend-api-secret
    secretKey: db-password
  - envName: SPRING_DATASOURCE_USERNAME
    secretName: moment-prod-backend-api-secret
    secretKey: db-username
  - envName: SPRING_DATASOURCE_PASSWORD
    secretName: moment-prod-backend-api-secret
    secretKey: db-password
  - envName: SPRING_FLYWAY_USER
    secretName: moment-prod-backend-api-secret
    secretKey: db-username
  - envName: SPRING_FLYWAY_PASSWORD
    secretName: moment-prod-backend-api-secret
    secretKey: db-password
  - envName: JWT_SECRET_KEY
    secretName: moment-prod-backend-api-secret
    secretKey: jwt-secret
  - envName: TOSS_SECRET_KEY
    secretName: moment-prod-backend-api-secret
    secretKey: toss-secret-key
  - envName: TOSS_CLIENT_KEY
    secretName: moment-prod-backend-api-secret
    secretKey: toss-client-key
  - envName: TOSS_SUCCESS_URL
    secretName: moment-prod-backend-api-secret
    secretKey: toss-success-url
  - envName: TOSS_FAIL_URL
    secretName: moment-prod-backend-api-secret
    secretKey: toss-fail-url
  - envName: KAKAO_CLIENT_SECRET
    secretName: moment-prod-backend-api-secret
    secretKey: kakao-client-secret
  - envName: KAKAO_CLIENT_ID
    secretName: moment-prod-backend-api-secret
    secretKey: kakao-client-id
  - envName: KAKAO_REDIRECT_URI
    secretName: moment-prod-backend-api-secret
    secretKey: kakao-redirect-uri
  - envName: PUBLIC_DATA_DATA_GO_KR_SERVICE_KEY
    secretName: moment-prod-backend-api-secret
    secretKey: public-data-data-go-kr-service-key

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 30
  successThreshold: 1

livenessProbe:
  tcpSocket:
    port: 8080
  initialDelaySeconds: 180
  periodSeconds: 15
  timeoutSeconds: 2
  failureThreshold: 5
  successThreshold: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
# HA: RollingUpdate - prod는 무중단 배포 (maxUnavailable: 0)
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# HA: PDB - karpenter-spot-lab 케이스 D와 같은 minAvailable 50% (replica 2 → 1개 보호)
pdb:
  enabled: true
  minAvailable: 50%

# Spot 회수·스케일 인 대응 (karpenter-spot-lab 케이스 D: preStop 20s + grace 60s)
# preStop 동안 Pod는 계속 응답하면서 Service/ALB 대상에서 빠진다. 네이티브 sleep 액션이라 셸이 필요 없다.
terminationGracePeriodSeconds: 60
lifecycle:
  preStop:
    sleep:
      seconds: 20

# Karpenter on-demand-base NodePool (capacitySplit 비활성 시 모든 Pod)
nodeSelector:
  karpenter.sh/capacity-type: on-demand

tolerations:
  - key: capacity
    operator: Equal
    value: on-demand
    effect: NoSchedule

# base/burst 분할: HPA minReplicas(2)까지 on-demand, 초과분 Spot.
# capacity-split 웹훅 이미지를 ECR에 올리고 gitops/values/prod/capacity-split-webhook-values.yaml의
# image.tag를 채운 뒤 true로 바꾼다 (docs/karpenter.md 활성화 절차).
capacitySplit:
  enabled: false

# HA: topology - prod core 노드 2개 (3a, 3c) 멀티AZ 분산
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - backend-api
          topologyKey: topology.kubernetes.io/zone

# AZ 분산 (karpenter-spot-lab 케이스 D). Karpenter가 부족한 AZ에 노드를 띄운다.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: backend-api
        app.kubernetes.io/instance: backend-api-prod
    matchLabelKeys:
      - pod-template-hash

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200,401"
    # karpenter-spot-lab 고정값: 종료 중인 대상은 30초 안에 빠진다 (preStop 20s < 30s < grace 60s)
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    # karpenter-spot-lab 고정값: 경고 없이 사라진 대상을 10초 x 2회 안에 unhealthy로 판정
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    external-dns.alpha.kubernetes.io/hostname: origin-prod-api.moment-team04.click
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

# kube-prometheus-stack values for dev environment
# M4 scope: Metrics + Dashboard + Health + Alert 중심
# Loki / Promtail 중앙 로그 수집은 M4 범위 외

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec: {}

  # Application metrics scrape targets managed by kube-prometheus-stack.
  # Backend and AI metrics endpoints are implemented in application code.
  # Batch Worker is intentionally excluded because it has no HTTP metrics endpoint.
  additionalServiceMonitors:
    - name: moment-backend-api-dev
      additionalLabels:
        app.kubernetes.io/name: backend-api
        app.kubernetes.io/part-of: moment
        environment: dev
      selector:
        matchLabels:
          app.kubernetes.io/name: backend-api
          app.kubernetes.io/instance: backend-api-dev
      namespaceSelector:
        matchNames:
          - moment-dev
      endpoints:
        - port: http
          path: /actuator/prometheus
          interval: 30s
          scrapeTimeout: 10s
          scheme: http

    - name: moment-ai-service-dev
      additionalLabels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/part-of: moment
        environment: dev
      selector:
        matchLabels:
          app.kubernetes.io/name: ai-service
          app.kubernetes.io/instance: ai-service-dev
      namespaceSelector:
        matchNames:
          - moment-dev
      endpoints:
        - port: http
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s
          scheme: http

grafana:
  enabled: true
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
      provider:
        allowUiUpdates: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfigMatcherStrategy:
      type: None
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# kube-prometheus-stack chart에는 포함되지 않는 별도 로그 수집 도구를 명시적으로 비활성화한다.
loki:
  enabled: false

promtail:
  enabled: false


# EKS managed control plane components are not scraped through kube-system Services.
# Keep monitoring AppProject scoped to the monitoring namespace and avoid kube-system Service creation.
kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

kubeProxy:
  enabled: false

coreDns:
  enabled: false

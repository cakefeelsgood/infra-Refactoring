image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.15.1
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: external-dns
  annotations: {}

provider: aws

sources:
  - ingress

domainFilters: []
zoneIdFilters: []

txtOwnerId: moment
policy: upsert-only
registry: txt
interval: 1m
logLevel: info

aws:
  zoneType: public

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

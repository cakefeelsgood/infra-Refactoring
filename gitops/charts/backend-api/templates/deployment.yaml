apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-api.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "backend-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "backend-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend-api.labels" . | nindent 8 }}
        {{- if .Values.capacitySplit.enabled }}
        {{- /* Opt-in for the capacity-split webhook (objectSelector). */}}
        capacity-split.moment.io/enabled: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "backend-api.fullname" .) }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      containers:
        - name: backend-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.config }}
          envFrom:
            - configMapRef:
                name: {{ include "backend-api.fullname" . }}-config
          {{- end }}
          {{- if .Values.secretRefs }}
          env:
            {{- range .Values.secretRefs }}
            - name: {{ .envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- /*
        capacitySplit.enabled: the webhook adds the on-demand affinity + toleration to base pods
        (HPA minReplicas). The template carries only the burst defaults, so a pod admitted while the
        webhook is unavailable (failurePolicy Ignore) is scheduled as burst on Spot.
        Disabled: every pod uses nodeSelector/tolerations below (all on-demand).
      */}}
      {{- $nodeSelector := ternary .Values.capacitySplit.nodeSelector .Values.nodeSelector .Values.capacitySplit.enabled }}
      {{- $tolerations := ternary .Values.capacitySplit.tolerations .Values.tolerations .Values.capacitySplit.enabled }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := deepCopy (.Values.affinity | default dict) }}
      {{- if .Values.capacitySplit.enabled }}
      {{- $_ := set $affinity "nodeAffinity" .Values.capacitySplit.nodeAffinity }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

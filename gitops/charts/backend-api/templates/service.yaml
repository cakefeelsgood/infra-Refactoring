apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend-api.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "backend-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "backend-api.selectorLabels" . | nindent 4 }}

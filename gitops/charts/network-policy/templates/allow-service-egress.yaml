{{ if and .Values.serviceEgress .Values.serviceEgress.enabled }}
{{ range .Values.serviceEgress.rules }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .name }}-egress
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
{{ toYaml .fromPodSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
      - podSelector:
          matchLabels:
{{ toYaml .toPodSelector | nindent 12 }}
      ports:
{{ range .ports }}
      - protocol: TCP
        port: {{ . }}
{{ end }}
{{ end }}
{{ end }}

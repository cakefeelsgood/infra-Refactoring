{{ if and .Values.dataTierEgress .Values.dataTierEgress.enabled }}
{{ range .Values.dataTierEgress.workloads }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .name }}-data-tier-egress
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
{{ toYaml .podSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
{{ range $.Values.dataTierCidrs }}
      - ipBlock:
          cidr: {{ . | quote }}
{{ end }}
      ports:
{{ range .ports }}
      - protocol: TCP
        port: {{ . }}
{{ end }}
{{ end }}
{{ end }}

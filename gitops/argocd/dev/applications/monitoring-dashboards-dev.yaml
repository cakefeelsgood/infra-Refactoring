apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-dashboards-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: monitoring-dashboards
    app.kubernetes.io/part-of: moment
    app.kubernetes.io/managed-by: argocd
    environment: dev
spec:
  project: monitoring-dev
  source:
    repoURL: https://github.com/Team-msp-architect-2026/msp-team04-infra.git
    targetRevision: develop
    path: monitoring/dashboards/dev
    directory:
      recurse: true
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

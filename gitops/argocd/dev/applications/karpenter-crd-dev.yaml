apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-crd-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: karpenter-crd
    app.kubernetes.io/part-of: moment
    app.kubernetes.io/managed-by: argocd
    environment: dev
spec:
  project: karpenter-dev
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter-crd
    targetRevision: 1.15.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    # Same as the other dev apps: the dev service apps auto-sync onto Karpenter nodes, so Karpenter must too.
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moment-dev-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: moment
    app.kubernetes.io/managed-by: argocd
    environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/Team-msp-architect-2026/msp-team04-infra.git
    targetRevision: develop
    path: gitops/argocd/dev
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: capacity-split-webhook-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: capacity-split-webhook
    app.kubernetes.io/part-of: moment
    app.kubernetes.io/managed-by: argocd
    environment: prod
spec:
  description: capacity-split mutating webhook (base on-demand / burst spot) for MoMent Prod EKS
  sourceRepos:
    - https://github.com/Team-msp-architect-2026/msp-team04-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: capacity-split-system
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding

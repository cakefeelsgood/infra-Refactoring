          "options": {
            "mode": "markdown",
            "content": "### AWS Managed Resource 알림 경로\n\n이 dashboard는 Prometheus 기준 Alert Overview입니다.\n\nAWS Managed Resource 알림은 별도 경로로 처리합니다.\n\n- CloudWatch Alarm → SNS → Lambda → Slack\n- RDS failover event → SNS → Lambda → Slack\n- ElastiCache event notification → SNS → Lambda → Slack\n\nCloudWatch Alarm 상태를 Grafana에서 직접 live panel로 보려면 Grafana CloudWatch datasource와 IAM 권한 구성이 추가로 필요합니다.\n\n현재 dashboard에서는 fake metric을 만들지 않고, Prometheus에서 실제 수집 가능한 EKS/Application/GitOps alert 상태만 표시합니다."

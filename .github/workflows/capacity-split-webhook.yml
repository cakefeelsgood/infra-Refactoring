name: capacity-split webhook image / activation

# Delivery path for the base/burst split (docs/karpenter.md "웹훅 활성화"):
#   1) mode=build-and-deploy      : test, build linux/amd64, push to ECR, set the webhook image.tag
#                                   -> ArgoCD renders the webhook (empty tag renders nothing)
#   2) confirm the webhook Pod is Ready and MutatingWebhookConfiguration caBundle is set
#   3) mode=enable-backend-split  : set backend-api capacitySplit.enabled=true
#   (mode=disable-backend-split reverts step 3)
# Steps 1 and 3 are separate runs on purpose: the webhook is fail-open, so backend pods created
# before it is Ready would all be admitted as burst (Spot, no pod-deletion-cost).
#
# The OIDC role only trusts refs/heads/develop of the infra repository (terraform modules/iam),
# so this runs from develop only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build-and-deploy | enable-backend-split | disable-backend-split"
        required: true
        default: build-and-deploy
        type: choice
        options:
          - build-and-deploy
          - enable-backend-split
          - disable-backend-split
      environment:
        description: "Environment (dev or prod)"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      dry_run:
        description: "Dry run (no push to ECR, no commit)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-northeast-3
  AWS_ACCOUNT_ID: "611058323802"
  WEBHOOK_DIR: tools/capacity-split-webhook

jobs:
  webhook:
    name: ${{ inputs.mode }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    env:
      ENV: ${{ inputs.environment }}
      WEBHOOK_VALUES: gitops/values/${{ inputs.environment }}/capacity-split-webhook-values.yaml
      BACKEND_VALUES: gitops/values/${{ inputs.environment }}/backend-api-values.yaml
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      # ---------- build-and-deploy ----------
      - name: Setup Go
        if: inputs.mode == 'build-and-deploy'
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/capacity-split-webhook/go.mod

      - name: go test
        if: inputs.mode == 'build-and-deploy'
        working-directory: ${{ env.WEBHOOK_DIR }}
        run: go test -race ./...

      - name: Configure AWS credentials (OIDC)
        if: inputs.mode == 'build-and-deploy' && inputs.dry_run == false
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/moment-${{ inputs.environment }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: inputs.mode == 'build-and-deploy' && inputs.dry_run == false
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        if: inputs.mode == 'build-and-deploy'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: inputs.mode == 'build-and-deploy'
        id: image
        run: |
          REPOSITORY="$(yq '.image.repository' "$WEBHOOK_VALUES")"
          # ECR tags are IMMUTABLE: one tag per commit and environment.
          TAG="${ENV}-$(git rev-parse --short HEAD)"
          PUSH=true
          [ "${{ inputs.dry_run }}" = "true" ] && PUSH=false
          docker buildx build --platform linux/amd64 \
            --tag "${REPOSITORY}:${TAG}" \
            --output "type=image,push=${PUSH}" \
            "$WEBHOOK_DIR"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set webhook image tag
        if: inputs.mode == 'build-and-deploy'
        run: |
          IMAGE_TAG="${{ steps.image.outputs.tag }}" yq -i '.image.tag = strenv(IMAGE_TAG)' "$WEBHOOK_VALUES"

      # ---------- enable / disable backend split ----------
      - name: Toggle backend-api capacitySplit
        if: inputs.mode != 'build-and-deploy'
        run: |
          if [ "${{ inputs.mode }}" = "enable-backend-split" ]; then
            if [ -z "$(yq '.image.tag // ""' "$WEBHOOK_VALUES")" ]; then
              echo "ERROR: $WEBHOOK_VALUES has no image.tag. Run mode=build-and-deploy first and confirm the webhook Pod is Ready."
              exit 1
            fi
            yq -i '.capacitySplit.enabled = true' "$BACKEND_VALUES"
          else
            yq -i '.capacitySplit.enabled = false' "$BACKEND_VALUES"
          fi

      # ---------- validation and commit ----------
      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Render and check placement
        run: |
          git diff
          for FILE in $(git diff --name-only); do
            [[ "$FILE" == gitops/values/* ]] || { echo "ERROR: unexpected file changed: $FILE"; exit 1; }
          done
          helm lint gitops/charts/capacity-split-webhook -f "$WEBHOOK_VALUES"
          helm lint gitops/charts/backend-api -f "$BACKEND_VALUES"
          ruby scripts/validation/check-capacity-placement.rb "$ENV"
          ruby scripts/validation/check-karpenter-wiring.rb "$ENV"

      - name: Commit and push values
        if: inputs.dry_run == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add gitops/values/
            git commit -m "[skip ci] chore(gitops): capacity-split ${{ inputs.mode }} ${{ inputs.environment }}"
            git push origin HEAD:develop
          fi

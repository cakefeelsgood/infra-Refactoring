name: Update Helm Values Image Tag

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to update (backend-api, ai-service, batch-job, backend-batch, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - backend-api
          - ai-service
          - batch-job
          - backend-batch
          - all
      image_tag:
        description: 'Image tag (e.g. dev-abc1234)'
        required: true
        type: string
      environment:
        description: 'Environment (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      dry_run:
        description: 'Dry run (do not commit)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  ECR_REGISTRY: 611058323802.dkr.ecr.ap-northeast-3.amazonaws.com

jobs:
  update-helm-values:
    name: Update Helm Values Image Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Set update targets
        id: targets
        run: |
          SERVICE="${{ inputs.service }}"
          ENV="${{ inputs.environment }}"
          TAG="${{ inputs.image_tag }}"

          if [ "$SERVICE" = "all" ]; then
            SERVICES="backend-api ai-service batch-job"
          elif [ "$SERVICE" = "backend-batch" ]; then
            SERVICES="backend-api batch-job"
          else
            SERVICES="$SERVICE"
          fi

          echo "SERVICES=$SERVICES" >> $GITHUB_OUTPUT
          echo "ENV=$ENV" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Update image tags with yq
        run: |
          # yq 명령 예시:
          # IMAGE_TAG="dev-abc1234" yq -i '.image.tag = strenv(IMAGE_TAG)' gitops/values/dev/backend-api-values.yaml
          # IMAGE_REPOSITORY="xxx.dkr.ecr.ap-northeast-3.amazonaws.com/moment-dev-backend-api" yq -i '.image.repository = strenv(IMAGE_REPOSITORY)' gitops/values/dev/backend-api-values.yaml

          SERVICES="${{ steps.targets.outputs.SERVICES }}"
          ENV="${{ steps.targets.outputs.ENV }}"
          TAG="${{ steps.targets.outputs.TAG }}"

          for SERVICE in $SERVICES; do
            VALUES_FILE="gitops/values/${ENV}/${SERVICE}-values.yaml"

            if [ ! -f "$VALUES_FILE" ]; then
              echo "ERROR: $VALUES_FILE not found"
              exit 1
            fi

            echo "Updating $VALUES_FILE with tag=$TAG"
            IMAGE_TAG="$TAG" yq -i '.image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"

            # YAML syntax 검증
            if ! yq '.' "$VALUES_FILE" > /dev/null 2>&1; then
              echo "ERROR: YAML syntax broken in $VALUES_FILE after update"
              exit 1
            fi

            echo "Updated $VALUES_FILE:"
            cat "$VALUES_FILE"
          done

      - name: Show git diff
        run: |
          git diff
          # diff가 values 파일 외 다른 파일 포함하는지 확인
          CHANGED=$(git diff --name-only)
          for FILE in $CHANGED; do
            if [[ "$FILE" != gitops/values/* ]]; then
              echo "ERROR: unexpected file changed: $FILE"
              exit 1
            fi
          done

      - name: Helm lint & template validation
        run: |
          SERVICES="${{ steps.targets.outputs.SERVICES }}"
          ENV="${{ steps.targets.outputs.ENV }}"
          TAG="${{ steps.targets.outputs.TAG }}"

          for SERVICE in $SERVICES; do
            VALUES_FILE="gitops/values/${ENV}/${SERVICE}-values.yaml"
            CHART_PATH="gitops/charts/${SERVICE}"

            echo "=== helm lint: $SERVICE ==="
            helm lint "$CHART_PATH" -f "$VALUES_FILE"

            echo "=== helm template: $SERVICE ==="
            RENDERED=$(helm template "$SERVICE" "$CHART_PATH" -f "$VALUES_FILE")
            echo "$RENDERED"

            # image tag 확인
            if echo "$RENDERED" | grep -q "$TAG"; then
              echo "✅ $SERVICE: image tag $TAG confirmed"
            else
              echo "❌ $SERVICE: image tag $TAG NOT found"
              exit 1
            fi

            # namespace 확인
            if echo "$RENDERED" | grep -q "namespace: moment-${ENV}"; then
              echo "✅ $SERVICE: namespace moment-${ENV} confirmed"
            else
              echo "❌ $SERVICE: namespace moment-${ENV} NOT found"
              exit 1
            fi

            # Secret 평문 노출 확인 (secretKeyRef/valueFrom 참조는 제외)
            if echo "$RENDERED" | grep -v "secretKeyRef\|configMapKeyRef\|valueFrom\|name:\|key:\|topologyKey:\|toss-\|kakao-\|public-data-\|jwt-\|db-" | grep -qiE "(password|secret|token|key)\s*:\s*['\"]?[A-Za-z0-9+/=]{8,}"; then
              echo "❌ $SERVICE: possible secret value exposed in rendered output"
              exit 1
            else
              echo "✅ $SERVICE: no plain secret values detected"
            fi

            # .env / kubeconfig / credential 포함 여부 확인
            if echo "$RENDERED" | grep -qiE "(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|kubeconfig|KUBECONFIG)"; then
              echo "❌ $SERVICE: credential detected in rendered output"
              exit 1
            else
              echo "✅ $SERVICE: no credentials detected"
            fi

            # selector/label 불일치 확인
            SELECTOR=$(echo "$RENDERED" | grep -A5 "selector:" | grep "app.kubernetes.io/name" | head -1 | awk '{print $2}')
            LABEL=$(echo "$RENDERED" | grep -A5 "matchLabels:" | grep "app.kubernetes.io/name" | head -1 | awk '{print $2}')
            if [ "$SELECTOR" = "$LABEL" ] || [ -z "$SELECTOR" ]; then
              echo "✅ $SERVICE: selector/label check passed"
            else
              echo "❌ $SERVICE: selector/label mismatch - selector=$SELECTOR label=$LABEL"
              exit 1
            fi

            # ServiceAccount 참조 확인
            SA_NAME=$(echo "$RENDERED" | grep "serviceAccountName:" | head -1 | awk '{print $2}')
            SA_DEFINED=$(echo "$RENDERED" | grep "kind: ServiceAccount" | wc -l)
            if [ "$SA_DEFINED" -gt 0 ]; then
              echo "✅ $SERVICE: ServiceAccount defined and referenced as $SA_NAME"
            else
              echo "⚠️ $SERVICE: ServiceAccount not found in rendered output"
            fi

            echo "--- $SERVICE validation passed ---"
          done

      - name: Save rendered output as artifact
        run: |
          SERVICES="${{ steps.targets.outputs.SERVICES }}"
          ENV="${{ steps.targets.outputs.ENV }}"
          mkdir -p /tmp/rendered

          for SERVICE in $SERVICES; do
            VALUES_FILE="gitops/values/${ENV}/${SERVICE}-values.yaml"
            CHART_PATH="gitops/charts/${SERVICE}"
            helm template "$SERVICE" "$CHART_PATH" -f "$VALUES_FILE" > /tmp/rendered/${SERVICE}-rendered.yaml
          done

      - name: Upload rendered output artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-rendered-${{ inputs.environment }}-${{ inputs.image_tag }}
          path: /tmp/rendered/
          retention-days: 7

      - name: Commit and push changes
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add gitops/values/
            git commit -m "[skip ci] chore(gitops): update ${{ inputs.service }} ${{ inputs.environment }} image tag to ${{ inputs.image_tag }}"
            git push origin HEAD:develop
          fi

      - name: Print summary
        run: |
          echo "## Helm Values Image Tag Update 결과" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ inputs.service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ inputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${{ inputs.dry_run }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 렌더링 검증 결과" >> $GITHUB_STEP_SUMMARY
          echo "| 서비스 | namespace | image tag | secret 노출 | credential | selector/label | ServiceAccount |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|-----------|-------------|------------|----------------|----------------|" >> $GITHUB_STEP_SUMMARY
          SERVICES="${{ steps.targets.outputs.SERVICES }}"
          ENV="${{ steps.targets.outputs.ENV }}"
          TAG="${{ steps.targets.outputs.TAG }}"
          for SERVICE in $SERVICES; do
            echo "| $SERVICE | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
          done
